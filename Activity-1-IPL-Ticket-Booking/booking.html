
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav>
            <h2>IPL 2026</h2>

            <button class="menu-toggle" id="menuToggle"
                aria-label="Toggle navigation" aria-expanded="false">
                ☰
            </button>

            <ul id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="booking.html">Book Ticket</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section id="bookingPage">

            <h1>IPL Ticket Booking Form</h1>

            <div class="booking-container">

                <!-- Booking Form -->
                <form id="bookingForm">

                    <label for="name">Full Name:</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        minlength="3"
                        maxlength="30"
                        required
                    >

                    <label for="email">Email:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="phone">Phone Number:</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter 10-digit phone number"
                        pattern="[0-9]{10}"
                        minlength="10"
                        maxlength="10"
                        required
                    >

                    <label for="match">Select Match:</label>

                    <select id="match" name="match" required>
                        <option value="">Choose Match</option>
                        <option value="RCB vs MI">RCB vs MI</option>
                        <option value="CSK vs KKR">CSK vs KKR</option>
                        <option value="MI vs SRH">MI vs SRH</option>
                        <option value="KKR vs RCB">KKR vs RCB</option>
                    </select>

                    <label for="stand">Stand Category:</label>

                    <select id="stand" name="stand" required>
                        <option value="">Choose Stand</option>
                        <option value="General">General</option>
                        <option value="Premium">Premium</option>
                        <option value="VIP">VIP</option>
                    </select>

                    <label for="quantity">Number of Tickets:</label>

                    <input
                        type="number"
                        id="quantity"
                        name="tickets"
                        min="1"
                        max="10"
                        required
                    >

                    <p class="food-heading">Food Preference:</p>

                    <div class="radio-group">

                        <label>
                            <input type="radio" name="food" value="Yes">
                            Food Included
                        </label>

                        <label>
                            <input type="radio" name="food" value="No">
                            No Food
                        </label>

                    </div>

                    <button type="submit">Confirm Booking</button>

                    <button type="reset" class="reset-btn">Reset</button>

                </form>

                <!-- Booking Summary Card -->
                <aside class="summary-card">

                    <h2>Booking Summary</h2>

                    <p>
                        Match:
                        <span id="summaryMatch">Not Selected</span>
                    </p>

                    <p>
                        Stand:
                        <span id="summaryStand">Not Selected</span>
                    </p>

                    <p>
                        Ticket Price:
                        ₹<span id="summaryPrice">0</span>
                    </p>

                    <p>
                        Quantity:
                        <span id="summaryQuantity">0</span>
                    </p>

                    <hr>

                    <h3>
                        Total: ₹<span id="summaryTotal">0</span>
                    </h3>

                </aside>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 IPL Ticket Booking. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script src="app.js"></script>

</body>
</html>
